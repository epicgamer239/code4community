    const root = document.getElementById("email-root");
    const status = document.getElementById("copy-status");
    const btn = document.getElementById("copy-btn");

    root.innerHTML = EMAIL_HTML;

    async function copyForGmail() {
      status.textContent = "";
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/html": new Blob([EMAIL_HTML], { type: "text/html" }),
            "text/plain": new Blob(
              ["Code4Community Weekly Brief — paste into Gmail using the Copy for Gmail button HTML."],
              { type: "text/plain" }
            ),
          }),
        ]);
        status.textContent = "Copied — paste in Gmail";
      } catch (err) {
        // Fallback for browsers that block ClipboardItem
        const range = document.createRange();
        range.selectNodeContents(root);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        const ok = document.execCommand("copy");
        sel.removeAllRanges();
        status.textContent = ok ? "Copied — paste in Gmail" : "Copy failed — try Chrome";
        console.error(err);
      }
    }

    btn.addEventListener("click", copyForGmail);
